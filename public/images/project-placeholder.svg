  <circle cx="600" cy="360" r="95" fill="none" stroke="#67e8f9" stroke-width="2" opacity=".55"/>
  <path d="M420 380h360M500 310h200M535 430h130" stroke="url(#line)" stroke-linecap="round" stroke-width="18" opacity=".95" filter="url(#glow)"/>
  <text x="600" y="555" fill="#cffafe" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="700" letter-spacing="8" text-anchor="middle">PROJECT PREVIEW</text>

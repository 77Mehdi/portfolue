    </filter>
  </defs>
  <rect width="1200" height="720" fill="url(#bg)"/>
  <g opacity=".28">
    <path d="M0 120H1200M0 240H1200M0 360H1200M0 480H1200M0 600H1200M120 0V720M240 0V720M360 0V720M480 0V720M600 0V720M720 0V720M840 0V720M960 0V720M1080 0V720" stroke="#67e8f9" stroke-width="1"/>
